name: Register maintenance immediately

on:
  push:
    branches: [main]
    paths:
      - 'maintenance_dispatch.json'

permissions:
  contents: write

concurrency:
  group: instant-maintenance-dispatch
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Validate configuration
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          test -n "$NOTION_TOKEN" || (echo "NOTION_TOKEN ausente" && exit 1)
          test -n "$FIREBASE_KEY" || (echo "FIREBASE_KEY ausente" && exit 1)

      - name: Register and verify maintenance in Firebase
        id: register
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python register_notion_page.py maintenance_dispatch.json maintenance_dispatch_status.json

      - name: Publish verification status
        if: always()
        run: |
          if [ ! -f maintenance_dispatch_status.json ]; then
            echo "Dispatch desativado ou nenhuma verificação gerada. Status anterior preservado."
            exit 0
          fi

          cp maintenance_dispatch_status.json /tmp/maintenance_dispatch_status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B publish-maintenance-status origin/main
          cp /tmp/maintenance_dispatch_status.json maintenance_dispatch_status.json
          git add maintenance_dispatch_status.json

          if git diff --cached --quiet; then
            echo "Status já publicado."
            exit 0
          fi

          git commit -m "status: confirmar manutenção no Firebase [skip ci]"
          git push origin HEAD:main

      - name: Fail workflow when registration was not verified
        if: steps.register.outcome == 'failure'
        run: exit 1
