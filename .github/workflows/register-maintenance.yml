name: Register maintenance immediately

on:
  push:
    branches: [main]
    paths:
      - 'maintenance_dispatch.json'

permissions:
  contents: read

concurrency:
  group: instant-maintenance-dispatch
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Validate configuration
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          test -n "$NOTION_TOKEN" || (echo "NOTION_TOKEN ausente" && exit 1)
          test -n "$FIREBASE_KEY" || (echo "FIREBASE_KEY ausente" && exit 1)

      - name: Register maintenance in Firebase
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python register_notion_page.py maintenance_dispatch.json
