name: Test preventive cycle panel

on:
  pull_request:
    branches: [main]
    paths:
      - 'preventive-cycle-ui.js'
      - 'mobile-polish.js'
      - 'install_preventive_cycle_ui.py'
      - 'service-worker.js'
      - '.github/workflows/test-preventive-cycle-panel.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax checks
        run: |
          node --check preventive-cycle-ui.js
          node --check mobile-polish.js
          node --check service-worker.js
          python -m py_compile install_preventive_cycle_ui.py
      - name: Validate mobile plan and dashboard polish
        run: |
          python install_preventive_cycle_ui.py
          grep -q '<script src="mobile-polish.js"></script>' index.html
          test "$(grep -c '<script src="mobile-polish.js"></script>' index.html)" -eq 1
          python install_preventive_cycle_ui.py
          test "$(grep -c '<script src="mobile-polish.js"></script>' index.html)" -eq 1
          grep -q 'cmms-plan-fields' mobile-polish.js
          grep -q 'cmms-report-month-field' mobile-polish.js
          grep -q 'cmms-report-month-input' mobile-polish.js
          grep -q 'Ciclo preventivo' mobile-polish.js
          grep -q 'Preventivas no mês' mobile-polish.js
          grep -q 'Acumulado do histórico' mobile-polish.js
          grep -q 'syncCanonicalHistoryToGlobalDB' mobile-polish.js
          grep -q "collectionGroup('history')" mobile-polish.js
          grep -q 'completed' mobile-polish.js
          grep -q 'de ${max}' mobile-polish.js
          grep -q '@media(max-width:520px)' mobile-polish.js
      - name: Validate L512 cycle count and full planned range
        run: |
          node - <<'NODE'
          const fs=require('fs'), vm=require('vm');
          global.window=global;
          global.state={mode:'register',step:'line'};
          global.LINE_CONFIGS={'512':{valveCount:175},'513':{valveCount:175},'514':{valveCount:72}};
          global.render=()=>{};
          global.renderOrdersView=()=>{};
          global.renderRegisterFlow=()=>{};
          global.lucide={createIcons(){}};
          const listeners={};
          global.db={collection(name){return {onSnapshot(cb){listeners[name]=cb;}};}};
          let lastBlock=null;
          global.document={
            getElementById(){return null;},
            createElement(){return {id:'',className:'',innerHTML:'',remove(){}};}
          };

          const pendLabel={textContent:'Pendentes'};
          const pendValue={textContent:'169'};
          const prevLabel={textContent:'Preventivas'};
          const prevValue={textContent:'20'};
          pendLabel.nextElementSibling=pendValue;
          prevLabel.nextElementSibling=prevValue;
          const card={querySelectorAll(sel){return sel==='span'?[pendLabel,pendValue,prevLabel,prevValue]:[];}};
          const clickTarget={
            getAttribute(name){return name==='onclick'?"selectLine('512')":null;},
            closest(sel){return sel==='.card-industrial'?card:null;}
          };
          const registerContainer={querySelectorAll(sel){return sel==='[onclick]'?[clickTarget]:[];}};
          const root={querySelector(){return null;},appendChild(block){lastBlock=block;}};
          const ordersContainer={
            querySelectorAll(){return [];},
            querySelector(sel){return sel==='.space-y-4'?root:null;},
            firstElementChild:null
          };

          vm.runInThisContext(fs.readFileSync('preventive-cycle-ui.js','utf8'),{filename:'preventive-cycle-ui.js'});
          if(!listeners.maintenance_cycle_state) throw new Error('listener do ciclo não registrado');
          if(!listeners.maintenance_plans) throw new Error('listener dos planos não registrado');

          listeners.maintenance_cycle_state({forEach(cb){cb({id:'512',data(){return {completedThrough:41,nextValve:42};}});}});
          global.renderRegisterFlow(registerContainer);
          if(prevValue.textContent!=='41') throw new Error('Preventivas deveria ser 41, veio '+prevValue.textContent);
          if(pendValue.textContent!=='134') throw new Error('Pendentes deveria ser 134, veio '+pendValue.textContent);

          const now=new Date();
          const month=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
          listeners.maintenance_plans({forEach(cb){cb({id:month+'-512',data(){return {month,line:'512',plannedDate:'2026-08-24',valves:[42,43,44,45,46,47,48]};}});}});
          global.state.mode='orders';
          global.renderOrdersView(ordersContainer);
          const html=lastBlock?.innerHTML||'';
          for(const v of [42,43,44,45,46,47,48]) if(!html.includes('V'+v)) throw new Error('programação não mostra V'+v);
          if(!html.includes('7 válvulas')) throw new Error('programação não mostra total de 7 válvulas');
          if(!html.includes('Próxima no ciclo: V42')) throw new Error('posição do ciclo não está clara');
          console.log('OK: L512 mostra 41 preventivas, 134 pendentes e programação V42-V48 completa.');
          NODE
      - name: Validate canonical dashboard history bridge
        run: |
          node - <<'NODE'
          const fs=require('fs'), vm=require('vm');
          global.window=global;
          global.state={mode:'register',step:'line',cmms:{dashboardLine:'all',dashboardMonth:'2026-08'}};
          global.globalDB={'512':{'1':{valveNumber:1,historico:Array.from({length:26},(_,i)=>({id:'stale-'+i,type:'corretiva',timestamp:'2026-08-10T12:00:00Z'}))}},'513':{},'514':{}};
          global.render=()=>{};
          let historyCb=null;
          global.db={
            collection(){return {onSnapshot(cb){return ()=>{};}};},
            collectionGroup(name){return {onSnapshot(cb){if(name==='history')historyCb=cb;return ()=>{};}};}
          };
          const styles={};
          global.document={
            head:{appendChild(el){if(el.id)styles[el.id]=el;}},
            getElementById(id){return styles[id]||null;},
            querySelectorAll(){return [];},
            createElement(){return {id:'',className:'',innerHTML:'',classList:{add(){}},remove(){}};}
          };
          global.renderDashboardView=function(){
            const rows=[];
            for(const line of ['512','513','514']) for(const v of Object.values(globalDB[line]||{})) rows.push(...(v.historico||[]));
            global.__dashboardCounts={total:rows.length,corr:rows.filter(r=>r.type==='corretiva').length,prev:rows.filter(r=>r.type==='preventiva').length};
          };
          vm.runInThisContext(fs.readFileSync('mobile-polish.js','utf8'),{filename:'mobile-polish.js'});
          if(!historyCb) throw new Error('listener canônico do histórico não foi registrado');
          const docs=[];
          let n=0;
          for(let i=0;i<25;i++,n++) docs.push({id:'c'+n,ref:{path:`lines/512/valves/${i+1}/history/c${n}`},data(){return {type:'corretiva',timestamp:'2026-08-12T12:00:00Z'};}});
          for(let i=0;i<9;i++,n++) docs.push({id:'c'+n,ref:{path:`lines/513/valves/${i+1}/history/c${n}`},data(){return {type:'corretiva',timestamp:'2026-08-13T12:00:00Z'};}});
          for(let i=0;i<2;i++,n++) docs.push({id:'s'+n,ref:{path:`lines/513/valves/${i+50}/history/s${n}`},data(){return {type:'sonda_event',timestamp:'2026-08-14T12:00:00Z'};}});
          docs.push({id:'sap-event',ref:{path:'sap_orders/100003759812/history/event-1'},data(){return {type:'preventiva',timestamp:'2026-08-20T12:00:00Z'};}});
          historyCb({forEach(cb){docs.forEach(cb);}});
          state.mode='dashboard';
          const container={querySelector(){return null;},querySelectorAll(){return [];}};
          setTimeout(()=>{
            global.renderDashboardView(container);
            const c=global.__dashboardCounts;
            if(c.total!==36||c.corr!==34||c.prev!==0) throw new Error('contagem canônica incorreta: '+JSON.stringify(c));
            console.log('OK: dashboard ignora globalDB obsoleto e usa 36 registros canônicos (34 corretivas + 2 sonda).');
          },30);
          NODE
      - name: Validate fresh-cache path
        run: |
          grep -q "preventive-cycle-ui.js" service-worker.js
          grep -q "mobile-polish.js" service-worker.js
          grep -q "sala-valvulas-cmms-v2-v6" service-worker.js
