name: Test instant maintenance dispatch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-instant-dispatch.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Test same production path with existing V157 record
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python register_notion_page.py maintenance_dispatch.json

      - name: Verify exactly one synced MC9 record
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          python - <<'PY'
          import os, requests

          page_id = '3c3c5fcf-62b4-811b-9008-da861ffc516e'
          url = (
              'https://firestore.googleapis.com/v1/projects/'
              'sala-valvulas-ow-163b3/databases/(default)/documents/'
              'lines/513/valves/157?key=' + os.environ['FIREBASE_KEY']
          )
          r = requests.get(url, timeout=30)
          r.raise_for_status()
          history = (
              r.json().get('fields', {})
              .get('historico', {})
              .get('arrayValue', {})
              .get('values', [])
          )

          matches = []
          for value in history:
              fields = value.get('mapValue', {}).get('fields', {})
              notion_id = fields.get('notionPageId', {}).get('stringValue', '')
              if notion_id == page_id:
                  matches.append(fields)

          assert len(matches) == 1, f'esperado 1 registro, encontrados {len(matches)}'
          subset = matches[0].get('subset', {}).get('stringValue', '')
          assert subset == 'MC9', f'subset inesperado: {subset}'
          print(f'OK: 1 registro único para V157 / {subset}')
          PY
