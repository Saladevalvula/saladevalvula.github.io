name: Test instant maintenance dispatch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-instant-dispatch.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Test same production path with existing V157 record
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python register_notion_page.py maintenance_dispatch.json
