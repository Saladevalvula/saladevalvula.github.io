name: Install CMMS V2 shell

on:
  push:
    branches: [main]
    paths:
      - 'cmms-v2-prelude.js'
      - 'cmms-v2.js'
      - 'install_cmms_v2.py'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'app-icon.svg'

permissions:
  contents: write

concurrency:
  group: install-cmms-v2
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python install_cmms_v2.py
      - name: Publish index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html já está pronto."
            exit 0
          fi
          git commit -m "feat: ativar interface CMMS V2 [skip ci]"
          git push origin HEAD:main
