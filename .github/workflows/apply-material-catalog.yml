name: Apply material catalog

on:
  push:
    branches: [main]
    paths:
      - 'material_catalog_dispatch.json'

permissions:
  contents: write

concurrency:
  group: material-catalog-dispatch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Validate Firebase secret
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: test -n "$FIREBASE_KEY" || (echo "FIREBASE_KEY ausente" && exit 1)
      - name: Apply and verify catalog
        id: apply
        continue-on-error: true
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python apply_material_catalog_batch.py material_catalog_dispatch.json material_catalog_status.json
      - name: Publish verification receipt
        if: always()
        run: |
          if [ ! -f material_catalog_status.json ]; then exit 0; fi
          cp material_catalog_status.json /tmp/material_catalog_status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B publish-material-status origin/main
          cp /tmp/material_catalog_status.json material_catalog_status.json
          git add material_catalog_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "status: confirmar catálogo no Firebase [skip ci]"
          git push origin HEAD:main
      - name: Fail when catalog was not verified
        if: steps.apply.outcome == 'failure'
        run: exit 1
