name: Install monthly dashboard reporting

on:
  push:
    branches: [main]
    paths:
      - 'dashboard-reporting.js'
      - 'dashboard-reporting-pdf.js'
      - 'install_dashboard_reporting.py'

permissions:
  contents: write

concurrency:
  group: install-dashboard-reporting
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python install_dashboard_reporting.py
      - name: Publish index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html já contém o dashboard mensal e PDF."
            exit 0
          fi
          git commit -m "feat: ativar dashboard mensal e PDF [skip ci]"
          git push origin HEAD:main
