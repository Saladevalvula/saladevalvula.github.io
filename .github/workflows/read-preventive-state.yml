name: Read preventive state

on:
  push:
    branches: [main]
    paths:
      - 'preventive_state_request.json'

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Read Firebase state
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python read_preventive_state.py preventive_state_request.json preventive_state_status.json
      - name: Publish status
        run: |
          cp preventive_state_status.json /tmp/preventive_state_status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B publish-preventive-read origin/main
          cp /tmp/preventive_state_status.json preventive_state_status.json
          git add preventive_state_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "status: preventive state read [skip ci]"
          git push origin HEAD:main
