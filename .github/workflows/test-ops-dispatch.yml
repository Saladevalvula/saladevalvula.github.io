name: Test operational dispatch

on:
  pull_request:
    branches: [main]
    paths:
      - 'apply_ops_dispatch.py'
      - 'ops_dispatch.json'
      - 'ops_dispatch_status.json'
      - 'preventive-cycle-ui.js'
      - 'install_preventive_cycle_ui.py'
      - '.github/workflows/apply-ops-dispatch.yml'
      - '.github/workflows/install-preventive-cycle-ui.yml'
      - '.github/workflows/test-ops-dispatch.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          python -m py_compile apply_ops_dispatch.py install_preventive_cycle_ui.py
          node --check preventive-cycle-ui.js
      - name: Test installer idempotency
        run: |
          python install_preventive_cycle_ui.py
          grep -q '<script src="preventive-cycle-ui.js"></script>' index.html
          python install_preventive_cycle_ui.py
          test "$(grep -c '<script src="preventive-cycle-ui.js"></script>' index.html)" -eq 1
      - name: Validate dispatcher contracts
        env:
          FIREBASE_KEY: dummy
        run: |
          python - <<'PY'
          import apply_ops_dispatch as a
          plan={
            'line':'512','completedThrough':41,'plannedValves':[42,43,44,45,46,47,48],
            'plannedDate':'2026-08-24','month':'2026-08','linkedSapOrderIds':['100003749068','100003749070']
          }
          assert a.validate_preventive_plan(plan)==('512',41,[42,43,44,45,46,47,48],'2026-08')
          sap={
            'sapOrderNumber':'100003759812','line':'513','month':'2026-08','status':'concluida'
          }
          assert a.validate_sap_order(sap)==('100003759812','513','2026-08','concluida')
          assert a.safe_id('100003759812')=='100003759812'
          print('OK: contratos de plano preventivo e ordem SAP válidos.')
          PY
      - name: Validate UI exposes SAP linkage
        run: |
          grep -q 'linkedSapOrderIds' preventive-cycle-ui.js
          grep -q 'Ordem SAP não vinculada' preventive-cycle-ui.js
