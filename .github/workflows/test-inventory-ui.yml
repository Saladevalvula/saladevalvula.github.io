name: Test inventory UI

on:
  push:
    branches: [main]
    paths:
      - 'inventory-ui.js'
      - 'dashboard-reporting-pdf.js'
      - 'service-worker.js'
      - '.github/workflows/test-inventory-ui.yml'
  pull_request:
    paths:
      - 'inventory-ui.js'
      - 'dashboard-reporting-pdf.js'
      - 'service-worker.js'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check inventory-ui.js
          node --check dashboard-reporting-pdf.js
          node --check service-worker.js
      - name: Verify module wiring
        run: |
          grep -q "inventory-ui.js" dashboard-reporting-pdf.js
          grep -q "inventory-ui.js" service-worker.js
          grep -q "Materiais & Estoque" inventory-ui.js
          grep -q "db.collection('materials')" inventory-ui.js
          echo '{"status":"verified","module":"inventory-ui","checks":["syntax","loader","service-worker","firestore-listener"]}' > inventory_ui_test_status.json
      - name: Publish verification receipt
        if: github.event_name == 'push'
        run: |
          cp inventory_ui_test_status.json /tmp/inventory_ui_test_status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B publish-inventory-ui-status origin/main
          cp /tmp/inventory_ui_test_status.json inventory_ui_test_status.json
          git add inventory_ui_test_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "status: validar módulo de estoque [skip ci]"
          git push origin HEAD:main
