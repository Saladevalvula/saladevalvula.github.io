name: Verify history batch

on:
  push:
    branches: [main]
    paths:
      - 'history_verify_request.json'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Verify history batch
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python verify_history_batch.py history_verify_request.json history_verify_status.json
      - name: Publish status
        run: |
          cp history_verify_status.json /tmp/history_verify_status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B publish-history-verify origin/main
          cp /tmp/history_verify_status.json history_verify_status.json
          git add history_verify_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "status: history batch verified [skip ci]"
          git push origin HEAD:main
